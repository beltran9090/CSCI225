<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light pt-5">
    <nav class="navbar navbar-dark bg-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Allen Beltran</a>
            <ul class="nav fw-bold">
                <li class="nav-item">
                    <a class="nav-link text-white" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="ContactMe.html">Contact</a>
                </li>
            </ul>
        </div>
    </nav>
    <h1>Contact Me</h1>
    <p><a href="index.html"> Return to Home Page</a></p>
    <div class="container mt-4">
        <div class="row g-4">
            <div class="col-md-6">


                <h2>Video</h2>
                <iframe class="border border-3 border-primary rounded w-100" width="560" height="315"
                    src="https://www.youtube.com/embed/QC8iQqtG0hg?si=w1Q6LYq-YWy2hZix" title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="col-md-6">

                <h2>Feedback Form</h2>
                <form name="feedback">
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="lname" name="lname" placeholder="Last Name"
                            required>
                        <label for="lname">Last Name</label>
                    </div>
                    <div class="mb-3">
                        <label for="mail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="mail" name="mail" placeholder="name@domain.com"
                            aria-describedby="emailHelp">
                        <small id="emailHelp" class="form-text text-muted">
                            Your email will not be shared.
                        </small>
                    </div>

                    <div class="mb-3">
                        <label for="fname" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="fname" name="fname" placeholder="First Name"
                            required>
                    </div>

                    <div class="mb-3">
                        <p>Would you recommend this website?</p>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="recommend" id="recommendYes" value="yes">
                            <label class="form-check-label" for="recommendYes">Yes</label>
                        </div>

                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="recommend" id="recommendNo" value="no">
                            <label class="form-check-label" for="recommendNo">No</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="favorite" class="form-label">Favorite Website</label>
                        <select id="favorite" name="favorite" class="form-select">
                            <option value="google">Google</option>
                            <option value="facebook">Facebook</option>
                            <option value="twitter">Twitter</option>
                            <option value="time">Time</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="rating" class="Form-label">Rating</label>
                        <input type="range" class="form-range" id="rating" name="rating" min="1" max="10">
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">Additional Comments</label>
                        <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
                    </div>

                    <div class="mb-3">
                        <label for="color" class="form-label">Favorite Color</label>
                        <input type="color" class="form-control form-control-color" id="color" name="color">
                    </div>


                    <div class="mb-3">
                        <label for="date" class="form-label">Visit Date</label>
                        <input type="date" class="form-control" id="date" name="date">
                    </div>

                    <div class="mb-3">
                        <label for="website" class="form-label">Website</label>
                        <input type="url" class="form-control" id="website" name="website"
                            placeholder="https://example.com">
                    </div>
                    <input type="submit" name="submit" class="btn btn-primary" value="Submit Feedback">

                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
